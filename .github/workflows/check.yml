name: Check

on:
  push:
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Bash scripts
        run: |
          bash -n install.sh
          bash -n get/install.sh
          bash -n host/hivepanel-update
          bash -n repair.sh
          bash -n host/hivepanel-common.sh

      - name: Host regression tests
        run: sudo python3 tests/test_host_tools.py
